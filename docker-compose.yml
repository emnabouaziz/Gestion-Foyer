version: "3.8"

services:
  mysqldb:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_DATABASE=
    ports:
      - 3306:3306
    volumes:
      - db:/var/lib/mysql
  app-tp-foyer:
    depends_on:
      - mysqldb
    image: amirabenhenda/tp-foyer-5.0.0.jar
    restart: on-failure
    ports:
      - 8089:8089
    environment:
      SPRING_APPLICATION_JSON: '{
          "spring.datasource.url" : "jdbc:mysql://mysqldb:3306/db?createDatabaseIfNotExist=true",
          "spring.datasource.username" : "root",
          "spring.datasource.password" : null,
          "spring.jpa.show-sql" : "true",
          "spring.jpa.hibernate.ddl-auto" : "update"
      }'
    stdin_open: true
    tty: true
volumes:
  db: