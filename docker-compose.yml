version: "3.8"

services:
  mysqldb:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_DATABASE=timesheet_db
    ports:
      - 3306:3306
    volumes:
      - db:/var/lib/mysql
  app-timesheet:
    depends_on:
      - mysqldb  # Spécifie que ce service dépend de "mysqldb", donc le conteneur mysqldb sera démarré avant ce service.
    image: riadhkhzemix/tp-foyer-5.0.0
    #build : ./
    restart: on-failure  # Redémarre le conteneur uniquement si l'application échoue
    ports:
      - 8082:8082 # Mappe le port 8082 de la machine hôte vers le port 8082 du conteneur, permettant d'accéder à l'application via ce port.
    environment:
      SPRING_APPLICATION_JSON: '{
        "spring.datasource.url"  : "jdbc:mysql://mysqldb:3306/timesheet_db?createDatabaseIfNotExist=true",
        "spring.datasource.username" : "root",
        "spring.datasource.password" : null,
        "spring.jpa.properties.hibernate.dialect" : "org.hibernate.dialect.MySQL5InnoDBDialect",
        "spring.jpa.hibernate.ddl-auto" : "update"
      }'
    stdin_open: true
    tty: true  # Alloue un terminal pour le conteneur, ce qui permet de l'utiliser en mode interactif.

volumes:
  db : # Crée un volume Docker nommé "db" pour stocker de manière persistante les données MySQL.
